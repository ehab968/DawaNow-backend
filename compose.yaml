services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dawanow}
      MYSQL_USER: ${MYSQL_USER:-dawanow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dawanow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-dawanow}
      DB_USERNAME: ${MYSQL_USER:-dawanow}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dawanow}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      PRODUCT_IMPORT_ENABLED: "true"
      SBG_API_KEY: ${SBG_API_KEY}
      AI_CHAT_GATEWAY_BASE_URL: ${AI_CHAT_GATEWAY_BASE_URL:-http://apiaccess.iti.net.eg/api/v1}
      AI_CHAT_MODEL_HAIKU: ${AI_CHAT_MODEL_HAIKU:-us.meta.llama3-3-70b-instruct-v1:0}
      AI_CHAT_MODEL_COMPLEX: ${AI_CHAT_MODEL_COMPLEX:-openai.gpt-oss-20b-1:0}
      AI_CHAT_MODEL_VISION: ${AI_CHAT_MODEL_VISION:-qwen.qwen3-vl-235b-a22b}
      AI_CHAT_MODEL_SAFEGUARD: ${AI_CHAT_MODEL_SAFEGUARD:-openai.gpt-oss-safeguard-20b}
      AI_CHAT_SAFETY_ENABLED: ${AI_CHAT_SAFETY_ENABLED:-true}
      AI_MEDICAL_PROTOTYPE_ENABLED: ${AI_MEDICAL_PROTOTYPE_ENABLED:-false}
      AI_CHAT_CONNECT_TIMEOUT_MS: ${AI_CHAT_CONNECT_TIMEOUT_MS:-5000}
      AI_CHAT_READ_TIMEOUT_MS: ${AI_CHAT_READ_TIMEOUT_MS:-60000}
    #      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
    #      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    #      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  mysql-data:
